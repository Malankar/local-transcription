name: Release

# Triggered by version tags pushed to the repo, e.g.:
#   pnpm version patch && git push origin --tags
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

  # Allow manual release from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── macOS Intel (x64) ───────────────────────────────────────────
          # macos-13 was retired Dec 2025; macos-15-intel is GitHub's current Intel runner.
          # Per-arch runner so pnpm installs the matching sherpa-onnx + ffmpeg-static binaries.
          - name: mac-x64
            os: macos-15-intel
            eb_args: --mac --x64
            release_script: release:mac:x64

          # ── macOS Apple Silicon (arm64) ─────────────────────────────────
          # macos-latest is M-series → arm64 sherpa-onnx + ffmpeg-static binaries
          - name: mac-arm64
            os: macos-latest
            eb_args: --mac --arm64
            release_script: release:mac:arm64

          # ── Linux x64 ───────────────────────────────────────────────────
          # Outputs AppImage + deb
          - name: linux
            os: ubuntu-latest
            eb_args: --linux
            release_script: release:linux

          # ── Windows x64 ─────────────────────────────────────────────────
          # Outputs NSIS installer
          - name: windows
            os: windows-latest
            eb_args: --win
            release_script: release:win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Windows: pnpm's default virtual-store path can exceed MAX_PATH (260 chars),
      # which causes makensis.exe to fail with ENOENT on long paths.
      - name: Limit pnpm store path length (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm config set virtual-store-dir-max-length 60

      # Linux: electron-builder needs rpmbuild for rpm targets (optional)
      # and fuse for AppImage mounting in tests.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfuse2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # electron-builder wants APPLE_API_KEY as a *path* to the .p8 file, so decode the secret
      # (base64 of the .p8) to disk. Notarization only turns on when all three secrets exist.
      - name: Prepare macOS notarization
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$APPLE_API_KEY_B64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            echo "$APPLE_API_KEY_B64" | base64 --decode > "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
            echo "EB_EXTRA_ARGS=-c.mac.notarize=true" >> "$GITHUB_ENV"
          else
            echo "Apple notarization secrets not set; building without notarization."
          fi

      # Native deps (sherpa-onnx, ffmpeg-static, audiotee) ship prebuilt per platform,
      # so nothing is compiled here.
      - name: Build & package (${{ matrix.name }})
        shell: bash
        run: pnpm run ${{ matrix.release_script }} $EB_EXTRA_ARGS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ── macOS signing & notarization ─────────────────────────────────
          # Required: Apple Developer ID Application certificate (.p12 → base64).
          # Generate: Keychain Access → export cert → base64 encode the .p12
          # Set notarize: true in electron-builder.yml once these are configured.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

          # App Store Connect API key for notarization (create at
          # https://appstoreconnect.apple.com/access/api). APPLE_API_KEY (the .p8 path) is set by
          # the "Prepare macOS notarization" step from the base64 secret of the same name.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

          # ── Windows code signing (optional) ──────────────────────────────
          # Without this, SmartScreen shows an "Unknown publisher" warning.
          # CSC_LINK / CSC_KEY_PASSWORD re-used (same env var names as macOS).
          # Windows signing uses the same .p12 certificate format.

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.exe
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release edit "$TAG" \
            --draft=false \
            --generate-notes \
            --title "LocalTranscribe $TAG"
