appId: com.local-transcription.app
productName: LocalTranscribe
asar: true

files:
  - out/**/*
  - package.json

# Native addons, executables and dylibs can't be loaded from inside ASAR.
asarUnpack:
  - "**/*.node"
  - "node_modules/ffmpeg-static/**"
  - "node_modules/sherpa-onnx-*/**"
  - "node_modules/audiotee/bin/**"

directories:
  buildResources: build
  output: release

extraResources:
  - from: build/tray-icon.png
    to: tray-icon.png
  # Silero VAD (MIT, github.com/snakers4/silero-vad) splits audio into phrases for the worker.
  - from: build/silero_vad.onnx
    to: silero_vad.onnx

# Publish artifacts to GitHub Releases as a draft on every tagged build.
# Set to "always" via --publish flag in CI; this is a fallback default.
publish:
  provider: github
  releaseType: draft

# ── Linux ──────────────────────────────────────────────────────────────────
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
  executableName: localtranscribe
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"

# ── macOS ──────────────────────────────────────────────────────────────────
# Arch is driven by the CLI flag (--x64 or --arm64) passed per CI job so
# that each runner installs the native sherpa-onnx/ffmpeg binaries for its own arch.
mac:
  icon: build/icon.png
  target:
    - target: dmg
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: LocalTranscribe records audio from your microphone or loopback device to transcribe it on this Mac.
    # Required for system audio via Core Audio taps (macOS 14.2+); without it the tap records silence.
    NSAudioCaptureUsageDescription: LocalTranscribe records the audio playing on this Mac (meetings, videos) to transcribe it locally.
  # CI passes -c.mac.notarize=true automatically once the APPLE_API_KEY / APPLE_API_KEY_ID /
  # APPLE_API_ISSUER secrets exist (see .github/workflows/release.yml). Signing likewise only
  # happens when CSC_LINK / CSC_KEY_PASSWORD are set.
  notarize: false

dmg:
  # Disambiguate x64 vs arm64 downloads in the GitHub release.
  artifactName: "${productName}-${version}-${arch}.${ext}"

# ── Windows ────────────────────────────────────────────────────────────────
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
